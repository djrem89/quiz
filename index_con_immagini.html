<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Cloud + Immagini</title>
    <style>
        /* --- CSS GENERALE --- */
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { background: white; width: 100%; max-width: 700px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 20px; position: relative; }
        h1, h2 { text-align: center; color: #333; }
        
        /* Nav */
        .nav { display: flex; justify-content: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .nav button { background: none; border: none; font-size: 16px; margin: 0 10px; cursor: pointer; padding: 5px 10px; color: #666; }
        .nav button.active { color: #007bff; font-weight: bold; border-bottom: 2px solid #007bff; }
        
        /* --- QUIZ UI --- */
        .quiz-header { display: flex; justify-content: space-between; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 20px; color: #555; }
        .timer-box { font-weight: bold; color: #d9534f; display: flex; gap: 5px; }
        .section { display: none; }
        .section.active { display: block; }
        
        /* Stile Domanda e Immagini */
        .question-content { text-align: center; margin-bottom: 20px; }
        .question-text { font-size: 1.3em; font-weight: 600; margin-top: 10px; }
        .q-main-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 10px; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Opzioni */
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 500px) { .options-container { grid-template-columns: 1fr; } } /* Mobile: una colonna */

        .option-btn { 
            padding: 15px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            transition: 0.2s; min-height: 80px;
        }
        .option-btn:hover { background: #f9f9f9; border-color: #ccc; }
        .opt-img { max-width: 100px; max-height: 100px; margin-bottom: 5px; border-radius: 4px; display: none; }
        
        .correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        
        #next-btn-container { margin-top: 20px; text-align: right; display: none; clear: both; }
        .btn-next { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* --- ADMIN FORM --- */
        .form-group { margin-bottom: 15px; border-bottom: 1px dashed #eee; padding-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em;}
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; margin-bottom: 5px; }
        input::placeholder { color: #aaa; }
        
        .btn-primary { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn-edit-mode { background: #ffc107 !important; color: #333 !important; }
        .btn-cancel { width: 100%; padding: 8px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 5px; display: none; }

        .q-item { background: #f8f9fa; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #007bff; display: flex; justify-content: space-between; align-items: center; }
        .admin-actions { display: flex; gap: 5px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .edit-btn { background: #ffc107; color: #333; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }

        #result-container { text-align: center; display: none; }
        .score-board { font-size: 2em; color: #007bff; margin: 20px 0; }
        #admin-login { text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <button id="nav-quiz" class="active" onclick="switchTab('quiz')">Vai al Quiz</button>
        <button id="nav-admin" onclick="switchTab('admin')">Area Admin</button>
    </div>

    <!-- SEZIONE QUIZ -->
    <div id="quiz-section" class="section active">
        <div id="loading-msg" style="text-align:center;">Caricamento...</div>
        <div id="quiz-interface" style="display:none;">
            <div class="quiz-header">
                <span id="progress-text">Domanda 1/30</span>
                <div class="timer-box"><span>⏱️</span><span id="timer-display">45:00</span></div>
            </div>
            
            <div class="question-content">
                <!-- Immagine Domanda -->
                <img id="q-img-display" class="q-main-img" src="" alt="Immagine domanda">
                <div class="question-text" id="question-text"></div>
            </div>

            <div class="options-container" id="options-container"></div>
            
            <div id="next-btn-container">
                <button id="btn-next-action" class="btn-next" onclick="nextQuestion()">Prossima ➡</button>
            </div>
        </div>
        <div id="result-container">
            <h2 id="result-title">Quiz Terminato!</h2>
            <div class="score-board" id="final-score">0 / 0</div>
            <button class="btn-primary" onclick="restartQuiz()">Ricomincia</button>
        </div>
    </div>

    <!-- SEZIONE ADMIN -->
    <div id="admin-section" class="section">
        <div id="admin-login">
            <h3>Area Admin</h3>
            <input type="password" id="admin-pass" placeholder="Password (es: 1234)">
            <button class="btn-primary" onclick="checkAdminPass()">Entra</button>
        </div>

        <div id="admin-panel" style="display:none;">
            <h2>Gestione Domande + Immagini</h2>
            <p style="font-size:0.8em; color:#666;">Suggerimento: Carica le immagini su postimages.org o imgur.com e incolla qui il "Collegamento diretto".</p>

            <div class="form-group">
                <label>DOMANDA:</label>
                <input type="text" id="input-question" placeholder="Testo della domanda...">
                <input type="text" id="input-q-img" placeholder="URL Immagine (Facoltativo) es: https://...">
            </div>
            
            <div class="form-group">
                <label>Opzione A:</label>
                <input type="text" id="input-a" placeholder="Testo risposta A">
                <input type="text" id="input-a-img" placeholder="URL Immagine A (Facoltativo)">
            </div>
            <div class="form-group">
                <label>Opzione B:</label>
                <input type="text" id="input-b" placeholder="Testo risposta B">
                <input type="text" id="input-b-img" placeholder="URL Immagine B (Facoltativo)">
            </div>
            <div class="form-group">
                <label>Opzione C:</label>
                <input type="text" id="input-c" placeholder="Testo risposta C">
                <input type="text" id="input-c-img" placeholder="URL Immagine C (Facoltativo)">
            </div>
            <div class="form-group">
                <label>Opzione D:</label>
                <input type="text" id="input-d" placeholder="Testo risposta D">
                <input type="text" id="input-d-img" placeholder="URL Immagine D (Facoltativo)">
            </div>

            <div class="form-group">
                <label>Risposta Corretta:</label>
                <select id="input-correct">
                    <option value="0">Opzione A</option>
                    <option value="1">Opzione B</option>
                    <option value="2">Opzione C</option>
                    <option value="3">Opzione D</option>
                </select>
            </div>
            
            <button id="btn-save" class="btn-primary" onclick="handleSave()">Salva nel Cloud</button>
            <button id="btn-cancel-edit" class="btn-cancel" onclick="cancelEditMode()">Annulla Modifica</button>

            <div class="question-list">
                <h3>Database (<span id="questions-count">0</span>)</h3>
                <div id="admin-list">Loading...</div>
            </div>
        </div>
    </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // --- INCOLLA QUI LE TUE CHIAVI FIREBASE ---
    const firebaseConfig = {

  apiKey: "AIzaSyCcb6QSktkxTKAn1Wkj8Ymb0bbDcEokksA",

  authDomain: "enconimia-e-gestione.firebaseapp.com",

  projectId: "enconimia-e-gestione",

  storageBucket: "enconimia-e-gestione.firebasestorage.app",

  messagingSenderId: "202411164578",

  appId: "1:202411164578:web:8a209c25b2c6d0d9e828fb"

};


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, 'questions');

    window.db = db;
    window.colRef = colRef;
    window.getDocs = getDocs;
    window.addDoc = addDoc;
    window.deleteDoc = deleteDoc;
    window.updateDoc = updateDoc;
    window.doc = doc;
    
    loadFromCloud();
</script>

<script>
    // --- CONFIGURAZIONE ---
    const ADMIN_PASSWORD = "1234"; 
    const MAX_TIME_MINUTES = 45;
    const MAX_QUESTIONS = 30;

    let allQuestionsDB = [];
    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswering = false;
    let timeRemaining = 0;
    let timerInterval = null;
    let editingId = null; 

    // --- CLOUD LOGIC ---

    async function loadFromCloud() {
        try {
            const snapshot = await window.getDocs(window.colRef);
            allQuestionsDB = [];
            snapshot.docs.forEach(doc => {
                allQuestionsDB.push({ ...doc.data(), id: doc.id });
            });
            renderAdminList();
            document.getElementById('loading-msg').style.display = 'none';
        } catch (err) {
            console.error(err);
            document.getElementById('loading-msg').innerText = "Errore caricamento.";
        }
    }

    async function handleSave() {
        // Recupero dati testo
        const text = document.getElementById('input-question').value;
        const qImg = document.getElementById('input-q-img').value; // URL Immagine Domanda
        
        const opts = [
            document.getElementById('input-a').value,
            document.getElementById('input-b').value,
            document.getElementById('input-c').value,
            document.getElementById('input-d').value
        ];
        
        // Recupero dati immagini opzioni
        const optsImgs = [
            document.getElementById('input-a-img').value,
            document.getElementById('input-b-img').value,
            document.getElementById('input-c-img').value,
            document.getElementById('input-d-img').value
        ];

        const correct = parseInt(document.getElementById('input-correct').value);

        if (!text || opts.some(o => o.trim() === "")) { alert("Inserisci almeno il testo della domanda e le risposte!"); return; }

        const btn = document.getElementById('btn-save');
        const oldText = btn.innerText;
        btn.innerText = "Salvataggio...";
        btn.disabled = true;

        const dataPayload = {
            text: text,
            image: qImg, // Campo nuovo
            options: opts,
            optionsImages: optsImgs, // Campo nuovo array
            correct: correct
        };

        try {
            if (editingId) {
                await window.updateDoc(window.doc(window.db, 'questions', editingId), dataPayload);
                alert("Aggiornato!");
            } else {
                await window.addDoc(window.colRef, dataPayload);
                alert("Salvato!");
            }
            cancelEditMode();
            await loadFromCloud();
        } catch (e) {
            alert("Errore: " + e.message);
        }
        
        btn.innerText = oldText;
        btn.disabled = false;
        if(!editingId) btn.innerText = "Salva nel Cloud"; 
    }

    async function deleteQuestionCloud(id) {
        if(confirm("Eliminare?")) {
            await window.deleteDoc(window.doc(window.db, 'questions', id));
            loadFromCloud();
        }
    }

    function editQuestionStart(id) {
        const q = allQuestionsDB.find(item => item.id === id);
        if(!q) return;

        // Popola Testi
        document.getElementById('input-question').value = q.text;
        document.getElementById('input-a').value = q.options[0];
        document.getElementById('input-b').value = q.options[1];
        document.getElementById('input-c').value = q.options[2];
        document.getElementById('input-d').value = q.options[3];
        document.getElementById('input-correct').value = q.correct;

        // Popola Immagini (se esistono, altrimenti stringa vuota)
        document.getElementById('input-q-img').value = q.image || "";
        document.getElementById('input-a-img').value = (q.optionsImages && q.optionsImages[0]) || "";
        document.getElementById('input-b-img').value = (q.optionsImages && q.optionsImages[1]) || "";
        document.getElementById('input-c-img').value = (q.optionsImages && q.optionsImages[2]) || "";
        document.getElementById('input-d-img').value = (q.optionsImages && q.optionsImages[3]) || "";

        editingId = id;
        const btnSave = document.getElementById('btn-save');
        btnSave.innerText = "Aggiorna Modifica ✏️";
        btnSave.classList.add('btn-edit-mode');
        document.getElementById('btn-cancel-edit').style.display = 'block';
        document.getElementById('admin-panel').scrollIntoView({behavior: 'smooth'});
    }

    function cancelEditMode() {
        editingId = null;
        document.getElementById('input-question').value = '';
        document.getElementById('input-q-img').value = '';
        
        ['a','b','c','d'].forEach(id => {
            document.getElementById('input-'+id).value = '';
            document.getElementById('input-'+id+'-img').value = '';
        });
        document.getElementById('input-correct').value = 0;

        const btnSave = document.getElementById('btn-save');
        btnSave.innerText = "Salva nel Cloud";
        btnSave.classList.remove('btn-edit-mode');
        document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    // --- QUIZ LOGIC ---

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz() {
        if(allQuestionsDB.length === 0) { alert("Nessuna domanda!"); return; }

        currentQuestionIndex = 0;
        score = 0;
        isAnswering = false;
        
        let tempQuestions = JSON.parse(JSON.stringify(allQuestionsDB));
        quizQuestions = shuffleArray(tempQuestions).slice(0, MAX_QUESTIONS);

        document.getElementById('result-container').style.display = 'none';
        document.getElementById('quiz-interface').style.display = 'block';

        startTimer();
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('next-btn-container').style.display = 'none';
        if (currentQuestionIndex >= quizQuestions.length) { finishQuiz(false); return; }

        const q = quizQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = q.text;
        document.getElementById('progress-text').innerText = `Domanda ${currentQuestionIndex + 1}/${quizQuestions.length}`;

        // GESTIONE IMMAGINE DOMANDA
        const qImgDisplay = document.getElementById('q-img-display');
        if (q.image && q.image.trim() !== "") {
            qImgDisplay.src = q.image;
            qImgDisplay.style.display = 'inline-block';
        } else {
            qImgDisplay.style.display = 'none';
        }

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        // Prepara risposte con immagini
        // q.optionsImages potrebbe non esistere in vecchie domande, gestiamo con || []
        const optImgs = q.optionsImages || ["", "", "", ""];

        let answers = q.options.map((opt, idx) => ({ 
            text: opt, 
            img: optImgs[idx],
            originalIndex: idx 
        }));
        
        answers = shuffleArray(answers);

        answers.forEach((ans) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            
            // HTML del bottone: Immagine (se c'è) + Testo
            let btnHtml = "";
            if (ans.img && ans.img.trim() !== "") {
                btnHtml += `<img src="${ans.img}" class="opt-img" style="display:block">`;
            }
            btnHtml += `<span>${ans.text}</span>`;
            
            btn.innerHTML = btnHtml;
            btn.onclick = () => checkAnswer(ans.originalIndex, q.correct, btn, container);
            container.appendChild(btn);
        });
        isAnswering = false;
    }

    function checkAnswer(clickedIdx, correctIdx, btn, container) {
        if (isAnswering) return;
        isAnswering = true;
        const buttons = container.querySelectorAll('.option-btn');
        
        if (clickedIdx === correctIdx) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                // Nota: con innerHTML complesso, il confronto testo puro è rischioso.
                // Usiamo checkAnswer closure variables che sono sicure nel contesto
                // Ma per evidenziare quella giusta visualmente:
                // Ricostruiamo la logica: cerchiamo il bottone che corrisponde all'indice originale corretto?
                // No, nel DOM non abbiamo salvato l'indice originale. 
                // Metodo semplice: Coloriamo tutti e lasciamo perdere il controllo testo
            });
            // Metodo robusto per trovare il bottone corretto nel DOM mescolato:
            // Ripercorriamo l'array answers generato? No, è locale.
            // Soluzione: Aggiungiamo data-index ai bottoni quando li creiamo.
        }
        
        // Evidenzia cmq la risposta corretta
        // Per semplicità, in questa versione mostriamo solo se hai indovinato o no, 
        // oppure evidenziamo quella giusta ri-ciclando il testo (se unico)
        buttons.forEach(b => {
             if(b.innerText.includes(quizQuestions[currentQuestionIndex].options[correctIdx])) {
                 b.classList.add('correct');
             }
        });

        const nextBtnCont = document.getElementById('next-btn-container');
        const nextBtn = document.getElementById('btn-next-action');
        nextBtnCont.style.display = 'block';
        nextBtn.innerText = (currentQuestionIndex === quizQuestions.length - 1) ? "Concludi Test 🏁" : "Prossima ➡";
    }

    function nextQuestion() { currentQuestionIndex++; loadQuestion(); }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeRemaining = MAX_TIME_MINUTES * 60; 
        updateTimer();
        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimer();
            if (timeRemaining <= 0) { clearInterval(timerInterval); finishQuiz(true); }
        }, 1000);
    }
    function updateTimer() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2,'0');
        const s = (timeRemaining % 60).toString().padStart(2,'0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
    }
    function finishQuiz(isTimeOut) {
        if(timerInterval) clearInterval(timerInterval);
        document.getElementById('quiz-interface').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('result-title').innerText = isTimeOut ? "Tempo Scaduto!" : "Quiz Completato!";
        document.getElementById('final-score').innerText = `${score} / ${quizQuestions.length}`;
    }
    function restartQuiz() { startQuiz(); }

    function checkAdminPass() {
        if(document.getElementById('admin-pass').value === ADMIN_PASSWORD) {
            document.getElementById('admin-login').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        } else alert("Password errata");
    }
    function renderAdminList() {
        const list = document.getElementById('admin-list');
        list.innerHTML = '';
        document.getElementById('questions-count').innerText = allQuestionsDB.length;
        allQuestionsDB.forEach((q) => {
            const div = document.createElement('div');
            div.className = 'q-item';
            // Mostra icona immagine se presente
            const imgIcon = (q.image) ? "🖼️" : "";
            div.innerHTML = `
                <div style="flex-grow:1; margin-right:10px;"><strong>${q.text}</strong> ${imgIcon}</div>
                <div class="admin-actions">
                    <button class="edit-btn" onclick="editQuestionStart('${q.id}')">✏️</button>
                    <button class="delete-btn" onclick="deleteQuestionCloud('${q.id}')">🗑️</button>
                </div>`;
            list.appendChild(div);
        });
    }
    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(e=>e.classList.remove('active'));
        document.getElementById(tab+'-section').classList.add('active');
        document.getElementById('nav-'+tab).classList.add('active');
        if(tab==='quiz') startQuiz();
    }
</script>
</body>
</html>
